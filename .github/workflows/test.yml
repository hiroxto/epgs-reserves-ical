name: Test

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup mise
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          # デフォルトのキャッシュキーはmise.tomlなどmiseの設定ファイルのハッシュしか含まず、idiomatic_version_file_enable_toolsで読むバージョン指定ファイルの変更を反映しない。Node.jsやnpmのバージョンを上げたときに古いキャッシュを使わないよう、これらのファイルのハッシュを加える
          # Renovateがmise.lockの更新に対応していないため、mise.lockは使わずにバージョン指定ファイルをキャッシュキーに含める
          cache_key: "{{default}}-${{ hashFiles('.node-version', 'package.json') }}"

      - run: npm ci
      - run: npm run check
      - run: npm run tsc
